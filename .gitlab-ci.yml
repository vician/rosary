image: docker:git
services:
  - docker:dind

variables:
  CONTAINER_PATH: registry.gitlab.com/$CI_PROJECT_PATH
  CONTAINER_TEST_IMAGE: $CONTAINER_PATH:$CI_BUILD_REF_NAME
  CONTAINER_RELEASE_IMAGE: $CONTAINER_PATH:latest

before_script:
  - docker login -u gitlab-ci-token -p $CI_BUILD_TOKEN registry.gitlab.com

stages:
  - prepare
  - build
  - test
  - docker
  - release

prepare:
  image: alpine
  before_script: []
  stage: prepare
  script:
    - sed -i "s/\#site_url/site_url/g" mkdocs.yml
    - sed -i "s/&copy;/\&copy; $(date +%Y)/g" mkdocs.yml
  artifacts:
    paths:
      - mkdocs.yml

build:
  image:
    name: squidfunk/mkdocs-material
    entrypoint: [""]
  before_script: []
  stage: build
  script:
    - mkdocs build
  artifacts:
    paths:
      - site

test:
  image: registry.gitlab.com/vician/dockerhub/linkchecker
  before_script: []
  stage: test
  script:
    - linkchecker site/
  artifacts:
    paths:
      - site

docker:
  stage: docker
  script:
    - docker build -t $CONTAINER_TEST_IMAGE .
    - docker push $CONTAINER_TEST_IMAGE
  artifacts:
    paths:
      - site

release:
  stage: release
  script:
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
  only:
    - master
